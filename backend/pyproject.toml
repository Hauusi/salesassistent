[tool.ruff]
# Matches the width the codebase was already written to; the three lines
# that exceeded it were the only ones nobody had checked, because nothing
# ran ruff even though it was in requirements-dev.
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports/variables, undefined names
    "I",    # import sorting
    "B",    # bugbear: mutable defaults, shadowed loop vars, ...
    "UP",   # pyupgrade: outdated syntax
    "C4",   # comprehension simplifications
    "SIM",  # obvious simplifications
    "RUF",  # ruff-specific
]
ignore = [
    # A deliberately broad except is how the poll worker isolates one bad
    # message from the batch, and how the approval endpoint guarantees the
    # draft never gets stuck - both are documented at the call site.
    "BLE001",
    # `def route(db = Depends(get_db))` is FastAPI's dependency-injection
    # idiom, not an accidental shared mutable default.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests read better with long, descriptive assertions and fixture names.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
